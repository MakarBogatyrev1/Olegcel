<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Family Video Chat">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  
  <title>Семейный видеочат</title>
  <link rel="manifest" href="manifest.json">
  
  <style>
    body { margin: 0; padding: 0; background: #000; font-family: Arial, sans-serif; }
    #diagnostic-panel {
      position: fixed;
      bottom: 20px;
      left: 20px;
      right: 20px;
      background: rgba(0,0,0,0.9);
      color: #0f0;
      padding: 20px;
      border-radius: 10px;
      font-family: monospace;
      font-size: 12px;
      z-index: 10000;
      max-height: 300px;
      overflow-y: auto;
      display: none;
      border: 1px solid #0f0;
    }
    .device-item {
      padding: 5px;
      margin: 5px 0;
      border-left: 3px solid #0f0;
    }
    .device-item.video { border-left-color: #00f; }
    .device-item.audio { border-left-color: #ff0; }
    .device-item.error { border-left-color: #f00; color: #f00; }
    .btn {
      background: #007bff;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      margin: 5px;
    }
    #permission-status {
      margin: 10px 0;
      padding: 10px;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <!-- Панель диагностики -->
  <div id="diagnostic-panel">
    <h3>🔧 Диагностика устройств</h3>
    <div id="diagnostic-content">Загрузка...</div>
    <button class="btn" onclick="runDiagnostics()">🔄 Запустить диагностику</button>
    <button class="btn" onclick="hideDiagnostics()">✖️ Закрыть</button>
  </div>

  <!-- Кнопка для открытия диагностики -->
  <button onclick="showDiagnostics()" style="position:fixed; top:10px; left:10px; z-index:9999; background:#007bff; color:white; border:none; padding:5px 10px; border-radius:5px; cursor:pointer;">
    🔧 Диагностика
  </button>

  <script src="flutter_bootstrap.js" async></script>

  <script>
    // Показать панель диагностики
    function showDiagnostics() {
      document.getElementById('diagnostic-panel').style.display = 'block';
      runDiagnostics();
    }
    
    function hideDiagnostics() {
      document.getElementById('diagnostic-panel').style.display = 'none';
    }

    // Функция диагностики
    async function runDiagnostics() {
      const content = document.getElementById('diagnostic-content');
      content.innerHTML = '🔍 Проверка устройств...\n';
      
      try {
        // 1. Проверка поддержки браузера
        content.innerHTML += '\n📋 Информация о браузере:\n';
        content.innerHTML += `User Agent: ${navigator.userAgent}\n`;
        content.innerHTML += `Платформа: ${navigator.platform}\n`;
        content.innerHTML += `Язык: ${navigator.language}\n`;
        
        // 2. Проверка поддержки mediaDevices
        content.innerHTML += '\n🎥 Проверка mediaDevices:\n';
        if (navigator.mediaDevices) {
          content.innerHTML += '✅ mediaDevices поддерживается\n';
          
          // 3. Проверка разрешений
          if (navigator.permissions) {
            content.innerHTML += '\n🔐 Статус разрешений:\n';
            try {
              const cameraPermission = await navigator.permissions.query({ name: 'camera' });
              content.innerHTML += `Камера: ${cameraPermission.state}\n`;
            } catch (e) {
              content.innerHTML += `Камера: ошибка проверки - ${e.message}\n`;
            }
            
            try {
              const micPermission = await navigator.permissions.query({ name: 'microphone' });
              content.innerHTML += `Микрофон: ${micPermission.state}\n`;
            } catch (e) {
              content.innerHTML += `Микрофон: ошибка проверки - ${e.message}\n`;
            }
          }
          
          // 4. Получение списка устройств
          content.innerHTML += '\n📷 Доступные устройства:\n';
          const devices = await navigator.mediaDevices.enumerateDevices();
          
          if (devices.length === 0) {
            content.innerHTML += '❌ Нет доступных устройств\n';
          } else {
            let videoCount = 0;
            let audioCount = 0;
            
            devices.forEach((device, index) => {
              const icon = device.kind === 'videoinput' ? '📹' : 
                          device.kind === 'audioinput' ? '🎤' : '🔊';
              const label = device.label || '❓ Неизвестное устройство (без разрешений)';
              
              content.innerHTML += `${icon} [${device.kind}] ${label}\n`;
              if (device.kind === 'videoinput') videoCount++;
              if (device.kind === 'audioinput') audioCount++;
            });
            
            content.innerHTML += `\n📊 Статистика:\n`;
            content.innerHTML += `Видеокамер: ${videoCount}\n`;
            content.innerHTML += `Микрофонов: ${audioCount}\n`;
          }
          
          // 5. Тестовый запрос доступа
          content.innerHTML += '\n🔄 Тестовый запрос доступа:\n';
          
          if (videoCount === 0 && audioCount === 0) {
            content.innerHTML += '❌ Нет устройств для запроса\n';
          } else {
            try {
              const constraints = {};
              if (videoCount > 0) constraints.video = true;
              if (audioCount > 0) constraints.audio = true;
              
              content.innerHTML += `Запрос с параметрами: ${JSON.stringify(constraints)}\n`;
              
              const stream = await navigator.mediaDevices.getUserMedia(constraints);
              content.innerHTML += '✅ Доступ получен!\n';
              
              stream.getTracks().forEach(track => {
                content.innerHTML += `  - Трек ${track.kind}: ${track.enabled}\n`;
                track.stop();
              });
            } catch (err) {
              content.innerHTML += `❌ Ошибка доступа: ${err.name} - ${err.message}\n`;
              
              // Детальная диагностика ошибки
              switch(err.name) {
                case 'NotFoundError':
                case 'DevicesNotFoundError':
                  content.innerHTML += '\n🔍 РЕШЕНИЕ: Устройства не найдены.\n';
                  content.innerHTML += '1. Проверьте подключение камеры/микрофона\n';
                  content.innerHTML += '2. Убедитесь, что драйверы установлены\n';
                  content.innerHTML += '3. Проверьте настройки конфиденциальности Windows\n';
                  content.innerHTML += '4. Перезагрузите компьютер\n';
                  break;
                  
                case 'NotAllowedError':
                case 'PermissionDeniedError':
                  content.innerHTML += '\n🔍 РЕШЕНИЕ: Доступ запрещен.\n';
                  content.innerHTML += '1. Нажмите на значок замка в адресной строке\n';
                  content.innerHTML += '2. Разрешите доступ к камере и микрофону\n';
                  content.innerHTML += '3. Перезагрузите страницу\n';
                  break;
                  
                case 'NotReadableError':
                  content.innerHTML += '\n🔍 РЕШЕНИЕ: Устройство занято.\n';
                  content.innerHTML += '1. Закройте другие приложения (Zoom, Skype, Discord)\n';
                  content.innerHTML += '2. Перезагрузите компьютер\n';
                  break;
              }
            }
          }
        } else {
          content.innerHTML += '❌ mediaDevices не поддерживается\n';
          content.innerHTML += 'Используйте современный браузер: Chrome, Firefox, Edge\n';
        }
      } catch (e) {
        content.innerHTML += `❌ Ошибка диагностики: ${e.message}\n`;
      }
    }

    // Автоматическая диагностика при загрузке
    window.addEventListener('load', () => {
      console.log('Page loaded, running diagnostics...');
      setTimeout(() => {
        // Не показываем автоматически, но логируем в консоль
        runDiagnostics().catch(console.error);
      }, 1000);
    });

    // Обработка ошибок медиа
    window.addEventListener('error', (event) => {
      if (event.message && event.message.includes('getUserMedia')) {
        console.error('Media error caught:', event.message);
      }
    });
  </script>

  <!-- Простой запрос разрешений -->
  <script>
    (function() {
      console.log('Checking media devices...');
      
      // Проверяем устройства при загрузке
      if (navigator.mediaDevices) {
        navigator.mediaDevices.enumerateDevices()
          .then(devices => {
            console.log('Available devices:');
            devices.forEach(device => {
              console.log(`- ${device.kind}: ${device.label || 'unnamed'}`);
            });
            
            const hasVideo = devices.some(d => d.kind === 'videoinput');
            const hasAudio = devices.some(d => d.kind === 'audioinput');
            
            if (!hasVideo && !hasAudio) {
              alert('❌ Не найдено ни одного устройства!\n\n' +
                    'Проверьте:\n' +
                    '1. Подключена ли камера/микрофон\n' +
                    '2. Установлены ли драйверы\n' +
                    '3. Не заблокирован ли доступ в браузере');
            } else if (!hasVideo) {
              alert('⚠️ Камера не найдена. Вы сможете только слушать.');
            } else if (!hasAudio) {
              alert('⚠️ Микрофон не найден. Вы сможете только смотреть.');
            }
          })
          .catch(err => {
            console.error('Error enumerating devices:', err);
          });
      }
    })();
  </script>
</body>
</html>
