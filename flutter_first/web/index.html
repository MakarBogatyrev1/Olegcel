<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="flutter_first">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>flutter_first</title>
  <link rel="manifest" href="manifest.json">
  
  <!-- Добавляем мета-теги для камеры -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="handheld-friendly" content="true">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #000;
      overflow: hidden;
    }
    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-family: Arial, sans-serif;
      z-index: 1000;
    }
    .loading-content {
      text-align: center;
    }
    .spinner {
      width: 50px;
      height: 50px;
      border: 5px solid #ffffff;
      border-top: 5px solid transparent;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .permission-message {
      background: rgba(255, 255, 255, 0.2);
      padding: 15px;
      border-radius: 10px;
      margin: 20px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <!-- Экран загрузки -->
  <div id="loading">
    <div class="loading-content">
      <div class="spinner"></div>
      <h2>Загрузка приложения...</h2>
      <div id="permission-status" class="permission-message" style="display: none;">
        Запрос доступа к камере и микрофону...
      </div>
    </div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
  
  <!-- Скрываем экран загрузки после загрузки Flutter -->
  <script>
    window.addEventListener('load', function() {
      setTimeout(function() {
        document.getElementById('loading').style.display = 'none';
      }, 2000);
    });
  </script>

  <!-- Скрипт для запроса разрешений -->
  <script>
    (function() {
      console.log('Checking media devices support...');
      
      // Показываем статус
      const permissionStatus = document.getElementById('permission-status');
      
      // Проверяем поддержку getUserMedia
      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        console.log('✅ getUserMedia supported');
        
        // Проверяем, есть ли уже разрешения
        navigator.permissions.query({ name: 'camera' })
          .then(function(permissionStatus) {
            console.log('Camera permission state:', permissionStatus.state);
            
            if (permissionStatus.state === 'granted') {
              console.log('✅ Camera permission already granted');
            } else if (permissionStatus.state === 'prompt') {
              console.log('⏳ Camera permission will be requested');
            } else if (permissionStatus.state === 'denied') {
              console.log('❌ Camera permission denied');
            }
          })
          .catch(function(err) {
            console.log('Permissions API not supported fully:', err);
          });
        
        // Для iOS Safari и других браузеров - запрашиваем разрешения
        if (permissionStatus) {
          permissionStatus.style.display = 'block';
        }
        
        // Запрашиваем доступ к камере и микрофону
        navigator.mediaDevices.getUserMedia({ 
          video: true, 
          audio: true 
        })
        .then(function(stream) {
          console.log('✅ Media permissions granted');
          if (permissionStatus) {
            permissionStatus.innerHTML = '✅ Доступ к камере и микрофону получен';
            permissionStatus.style.backgroundColor = 'rgba(0, 255, 0, 0.2)';
          }
          
          // Останавливаем треки, чтобы не расходовать ресурсы
          stream.getTracks().forEach(track => {
            track.stop();
            console.log(`Track ${track.kind} stopped`);
          });
        })
        .catch(function(err) {
          console.log('❌ Media permissions error:', err.name, err.message);
          
          let errorMessage = '';
          switch(err.name) {
            case 'NotAllowedError':
            case 'PermissionDeniedError':
              errorMessage = '❌ Доступ запрещен. Пожалуйста, разрешите доступ к камере и микрофону в настройках браузера.';
              break;
            case 'NotFoundError':
            case 'DevicesNotFoundError':
              errorMessage = '❌ Камера или микрофон не найдены. Подключите устройства и перезагрузите страницу.';
              break;
            case 'NotReadableError':
            case 'TrackStartError':
              errorMessage = '❌ Не удалось получить доступ к устройствам. Возможно, они уже используются другим приложением.';
              break;
            case 'OverconstrainedError':
            case 'ConstraintNotSatisfiedError':
              errorMessage = '❌ Устройства не поддерживают требуемые параметры.';
              break;
            case 'TypeError':
              errorMessage = '❌ Ошибка типов. Возможно, браузер не поддерживается.';
              break;
            default:
              errorMessage = `❌ Ошибка: ${err.message || 'Неизвестная ошибка'}`;
          }
          
          if (permissionStatus) {
            permissionStatus.innerHTML = errorMessage;
            permissionStatus.style.backgroundColor = 'rgba(255, 0, 0, 0.2)';
          }
          
          // Показываем детальную информацию в консоли
          console.log('Error details:', {
            name: err.name,
            message: err.message,
            constraint: err.constraint,
            stack: err.stack
          });
        });
      } else {
        console.log('❌ getUserMedia not supported');
        alert('❌ Ваш браузер не поддерживает доступ к камере и микрофону. Пожалуйста, используйте современный браузер: Chrome, Firefox, Edge или Safari.');
      }
    })();
  </script>

  <!-- Дополнительный скрипт для мобильных устройств -->
  <script>
    // Проверяем, что это мобильное устройство
    if (/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) {
      console.log('Mobile device detected');
      
      // Для iOS добавляем специальную обработку
      if (/iPad|iPhone|iPod/.test(navigator.userAgent)) {
        console.log('iOS device detected');
        
        // Создаем кнопку для запроса разрешений (iOS требует пользовательского жеста)
        const loadingDiv = document.getElementById('loading');
        const buttonContainer = document.createElement('div');
        buttonContainer.style.marginTop = '20px';
        
        const requestButton = document.createElement('button');
        requestButton.textContent = 'Разрешить доступ к камере';
        requestButton.style.padding = '15px 30px';
        requestButton.style.fontSize = '18px';
        requestButton.style.backgroundColor = '#4CAF50';
        requestButton.style.color = 'white';
        requestButton.style.border = 'none';
        requestButton.style.borderRadius = '10px';
        requestButton.style.cursor = 'pointer';
        
        requestButton.onclick = function() {
          navigator.mediaDevices.getUserMedia({ video: true, audio: true })
            .then(function(stream) {
              console.log('iOS permissions granted');
              stream.getTracks().forEach(track => track.stop());
              requestButton.style.backgroundColor = '#45a049';
              requestButton.textContent = '✅ Доступ получен';
              requestButton.disabled = true;
            })
            .catch(function(err) {
              console.log('iOS permissions error:', err);
              requestButton.style.backgroundColor = '#f44336';
              requestButton.textContent = '❌ Ошибка доступа';
            });
        };
        
        buttonContainer.appendChild(requestButton);
        loadingDiv.querySelector('.loading-content').appendChild(buttonContainer);
      }
    }
  </script>
</body>
</html>
